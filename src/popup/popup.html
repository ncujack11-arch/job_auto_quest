<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>秋招网申自动填充</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-head">
    <img src="../assets/icons/icon32.png" alt="logo">
    <div>
      <h1>秋招网申自动填充</h1>
      <p id="site" class="site">当前页面: -</p>
    </div>
  </header>

  <main class="popup-body">
    <section class="profile-section">
      <label for="profileSelect">当前信息方案</label>
      <select id="profileSelect"></select>
      <button id="manageProfiles" class="link-btn" title="管理方案">管理</button>
    </section>

    <section id="scanInfo" class="scan-info hidden">
      <span>扫描到 <b id="fieldCount">0</b> 个表单字段</span>
      <button id="refreshScan" class="link-btn" title="重新扫描">↻</button>
    </section>

    <button id="fillBtn" class="primary-btn">⚡ 一键填充当前表单</button>
    <div id="fillStatus" class="fill-status hidden"></div>
    <div id="grabCard" class="grab-card hidden">
      <div id="grabInfo" class="grab-info"></div>
      <button id="saveGrabBtn" class="ghost-btn">📋 一键保存投递</button>
    </div>
    <button id="previewConfirmBtn" class="primary-btn hidden">✔ 立即确认填充(页面预览面板确认)</button>

    <section class="sections-box" id="sectionsBox">
      <div class="sections-head">
        <span>分段填充(仅填勾选模块)</span>
        <label class="mini-check"><input type="checkbox" id="allSections" checked> 全部</label>
      </div>
      <div class="sections-grid" id="sectionsGrid">
        <label class="mini-check"><input type="checkbox" value="basic" checked> 基本信息</label>
        <label class="mini-check"><input type="checkbox" value="education" checked> 教育经历</label>
        <label class="mini-check"><input type="checkbox" value="internship" checked> 实习经历</label>
        <label class="mini-check"><input type="checkbox" value="project" checked> 项目经历</label>
        <label class="mini-check"><input type="checkbox" value="skills" checked> 技能证书</label>
        <label class="mini-check"><input type="checkbox" value="intent" checked> 求职意向</label>
        <label class="mini-check"><input type="checkbox" value="openQuestions" checked> 开放题</label>
        <label class="mini-check"><input type="checkbox" value="custom" checked> 自定义</label>
      </div>
    </section>

    <section class="quick-row">
      <button id="openOptions" class="ghost-btn">⚙ 完整配置</button>
      <button id="manualRecord" class="ghost-btn">📋 记录投递</button>
    </section>
    <section class="quick-row">
      <button id="learnBtn" class="ghost-btn">📥 捕获页面已填内容入库</button>
    </section>
    <section class="quick-row">
      <button id="floatBtn" class="ghost-btn">🟢 显示悬浮操作面板</button>
    </section>
    <section class="quick-row">
      <button id="diagBtn" class="ghost-btn">🔍 页面诊断(排障用)</button>
    </section>

    <footer class="popup-foot">
      <span id="shortcutTip">快捷键: Alt+Shift+F 一键填充</span>
      <span class="privacy">🔒 纯本地运行 · 零网络请求</span>
    </footer>
  </main>

  <script src="../utils/logger.js"></script>
  <script src="../modules/schema.js"></script>
  <script src="../modules/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
